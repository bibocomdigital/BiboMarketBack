name: CI pour les pull et push dans master

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  build:
    runs-on: ubuntu-22.04

    environment: prod

    env:
      DATABASE_CONSOLE_URL: ${{ secrets.DATABASE_URL }}

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image locally
      run: |
        docker build \
          --build-arg DATABASE_URL="${{ secrets.DATABASE_URL }}" \
          --build-arg DATABASE_CONSOLE_URL="${{ secrets.DATABASE_URL }}" \
          -t nest-app:test .

    - name: Run container for healthcheck
      run: |
        docker run -d --name temp-app -p 3001:3001 \
          -e PORT=3001 \
          -e SKIP_MIGRATIONS=true \
          -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
          -e DATABASE_CONSOLE_URL="${{ secrets.DATABASE_URL }}" \
          nest-app:test

        for i in {1..20}; do
          if curl -f http://localhost:3001; then
            echo "Application prête"
            break
          fi
          sleep 3
        done

        docker logs temp-app
        docker stop temp-app
        docker rm temp-app

    - name: Login to Docker hub to push images
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build images to push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        build-args: |
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DATABASE_CONSOLE_URL=${{ secrets.DATABASE_URL }}
        tags: |
          ${{ vars.DOCKER_USERNAME }}/${{ vars.APP_NAME }}:latest
          ${{ vars.DOCKER_USERNAME }}/${{ vars.APP_NAME }}:${{ github.sha }}
          ${{ vars.DOCKER_USERNAME }}/${{ vars.APP_NAME }}:${{ github.ref_name }}
