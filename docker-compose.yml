services:
  backend:
    build:
      context: .
      target: src
      args:
        DATABASE_URL: ${DATABASE_URL}
        DATABASE_CONSOLE_URL: ${DIRECT_URL:-${DATABASE_URL}}
    container_name: biboMarketBack
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://2a6ed921d60c57541d37ac5e8ad2d40fc0bfc2474e248282981a667a12d6ab76:sk_BHMOb4yaEYDBhvuIXFiW3@db.prisma.io:5432/postgres?sslmode=require
      DIRECT_URL: postgres://2a6ed921d60c57541d37ac5e8ad2d40fc0bfc2474e248282981a667a12d6ab76:sk_BHMOb4yaEYDBhvuIXFiW3@db.prisma.io:5432/postgres?sslmode=require
    ports:
      - '3007:3000'
      - '5556:5555'
    volumes:
      - .:/app
      # Garde le node_modules du conteneur séparé de celui de l'hôte
      # (évite que npm ci Docker écrase/corrompe les deps utilisées par l'IDE)
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: postgresBiboMarket
    environment:
      POSTGRES_DB: biboMarket
      POSTGRES_USER: bibouser
      POSTGRES_PASSWORD: bibopassword
    ports:
      - '5438:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U bibouser -d biboMarket']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  backend_node_modules:
