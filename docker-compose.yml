services:
  backend:
    build:
      context: .
      target: src
      args:
        DATABASE_URL: ${DATABASE_URL}
        DATABASE_CONSOLE_URL: ${DIRECT_URL:-${DATABASE_URL}}
    container_name: biboMarketBack
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://bibouser:bibopassword@postgres:5432/biboMarket
      DIRECT_URL: postgresql://bibouser:bibopassword@postgres:5432/biboMarket
    ports:
      - '3007:3000'
      - '5556:5555'
    volumes:
      - .:/app
      # Garde le node_modules du conteneur séparé de celui de l'hôte
      # (évite que npm ci Docker écrase/corrompe les deps utilisées par l'IDE)
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - biboMarket-network

  postgres:
    image: postgres:17
    container_name: postgresBiboMarket
    environment:
      POSTGRES_DB: biboMarket
      POSTGRES_USER: bibouser
      POSTGRES_PASSWORD: bibopassword
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bibouser -d biboMarket']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - biboMarket-network

volumes:
  postgres_data:
  backend_node_modules:

networks:
  biboMarket-network:
    driver: bridge
